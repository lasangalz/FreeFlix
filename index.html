<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFlix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>FreeFlix</h1>

<input type="text" id="searchBar" placeholder="Search movies...">

<div class="movies">

    <div class="video-card" data-embed="https://www.2embed.cc/embed/tt0113277">
    <img src="posters/heat.jpg" class="poster" alt="Heat Poster">

    <div class="video-info">
        <h2>Heat (1995)</h2>
        <p>Crime • Drama</p>
    </div>
</div>

    <div class="video-card" data-embed="https://www.2embed.cc/embed/tt0086250">
        <img src="posters/scarface.jpg" class="poster" alt="Scarface Poster">

        <div class="video-info">
            <h2>Scarface (1983)</h2>
            <p>Crime • Drama</p>
        </div>
    </div>

    <div class="video-card" data-embed="">
        <img src="posters/eyeswideshut.jpg" class="poster" alt="Eyes Wide Shut Poster">

        <div class="video-info">
            <h2>Eyes Wide Shut (1999)</h2>
            <p>Drama • Mystery</p>
        </div>
    </div>

    <div class="video-card" data-embed="">
        <img src="posters/blackphone2.jpg" class="poster" alt="Black Phone 2 Poster">

        <div class="video-info">
            <h2>Black Phone 2 (2025)</h2>
            <p>Horror • Thriller</p>
        </div>
    </div>

</div>

<div id="playerContainer" style="display:none; margin-top:40px;">
    <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;">
        <iframe
            id="movieFrame"
            src=""
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"
            allowfullscreen>
        </iframe>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
